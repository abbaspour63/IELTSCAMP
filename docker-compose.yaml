services:
  wordpress:
    image: wordpress:php8.3-apache
    container_name: ielts-wordpress
    restart: unless-stopped
    ports:
      - "8092:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ielts_db
      WORDPRESS_DB_USER: ielts_user
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/themes:/var/www/html/wp-content/themes
      - ./wordpress/plugins:/var/www/html/wp-content/plugins
      - ./wordpress/uploads:/var/www/html/wp-content/uploads
      - ./wordpress/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ielts-network

  db:
    image: mysql:8.0
        
    container_name: ielts-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ielts-network


  tailwind:
    build:
      context: ./tailwind
    container_name: ielts-tailwind
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./tailwind:/app
      - ./wordpress/themes/ielts-academy:/theme
    command: ["sh", "-c", "npm install && exec npx @tailwindcss/cli -i ./src/input.css -o /theme/assets/css/output.css --watch=always"]
    networks:
      - ielts-network
volumes:
  wp_data:
  mysql_data:

networks:
  ielts-network:
    driver: bridge